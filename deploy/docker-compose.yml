# Base compose - node service only, used by all discovery backends
services:
  node:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    environment:
      - LOG_LEVEL=info
    ports:
      - "8080-8179:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

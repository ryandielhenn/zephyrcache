# Gossip (SWIM) discovery overlay
services:
  seed:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    environment:
      - DISCOVERY=gossip
      - SELF_ID=seed
      - SELF_ADDR=seed
      - LOG_LEVEL=info
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 3

  node:
    environment:
      - DISCOVERY=gossip
      - SEED_ADDR=seed:4000
    depends_on:
      seed:
        condition: service_healthy
